scenarios:
  - name: verified-hf-trainer-fingerprint-smoke
    family: transformer
    model_arch: bert
    trainer_style: hf-trainer-style
    verified_real_framework: true
    customer_workload_fingerprint: true
    precision: fp16
    batch_size: 2
    seq_len: 512
    hidden_size: 768
    layers: 6
    heads: 12
    steps: 4
    optimizer: adamw
    activation_checkpointing: false
    gradient_accumulation_steps: 1
    requested_gpu_type: l4
    requested_gpu_count: 1
    input_pipeline: cpu_to_gpu
    sample_interval_seconds: 0.1

  - name: verified-vision-framework-smoke
    family: cnn
    model_arch: resnet
    trainer_style: pytorch-image-classification-style
    verified_real_framework: true
    customer_workload_fingerprint: false
    precision: fp16
    batch_size: 16
    image_size: 224
    hidden_size: 128
    layers: 10
    steps: 4
    optimizer: adamw
    activation_checkpointing: false
    requested_gpu_type: t4
    requested_gpu_count: 1
    input_pipeline: cpu_to_gpu
    sample_interval_seconds: 0.1
