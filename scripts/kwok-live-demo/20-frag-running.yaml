# Two already-running GPU pods, one per node -> fragments the fleet (each node 3 free)
apiVersion: v1
kind: Pod
metadata:
  name: frag-a
  namespace: ksolver-demo
  labels: { ksolver-demo: "true", app: existing-training }
spec:
  nodeName: kwok-gpu-0
  tolerations:
  - { key: kwok.x-k8s.io/node, value: fake, effect: NoSchedule }
  containers:
  - name: trainer
    image: registry.k8s.io/pause:3.9
    resources:
      requests: { cpu: "1", memory: 2Gi, nvidia.com/gpu: "1" }
      limits: { nvidia.com/gpu: "1" }
---
apiVersion: v1
kind: Pod
metadata:
  name: frag-b
  namespace: ksolver-demo
  labels: { ksolver-demo: "true", app: existing-training }
spec:
  nodeName: kwok-gpu-1
  tolerations:
  - { key: kwok.x-k8s.io/node, value: fake, effect: NoSchedule }
  containers:
  - name: trainer
    image: registry.k8s.io/pause:3.9
    resources:
      requests: { cpu: "1", memory: 2Gi, nvidia.com/gpu: "1" }
      limits: { nvidia.com/gpu: "1" }
