name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  ORTOOLS_VERSION: "9.15.6755"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install OR-Tools
        run: |
          curl -fsSL https://github.com/google/or-tools/releases/download/v${ORTOOLS_VERSION}/or-tools_amd64_debian-13_cpp_v${ORTOOLS_VERSION}.tar.gz \
            | sudo tar xz -C /usr/local --strip-components=1
          sudo ldconfig

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check shadow demo scripts
        run: python3 scripts/test-operator-tools.py

      - name: VRAM->DRA wedge tests
        run: |
          python3 -m pip install --quiet numpy pyyaml
          cd vram-model-lab/scripts && python3 -m unittest test_vram_resolver test_vram_admission test_vram_admission_service test_model_quality_gate

      - name: Clippy
        run: cargo clippy --features rust-cp-sat -- -D warnings

      - name: Run tests
        run: cargo test --features rust-cp-sat

  dra-compat-smoke:
    # Manual only (needs Docker + kind; spins up ephemeral clusters). Live-verifies version-adaptive
    # DRA across k8s API versions — trigger from the Actions tab. Never runs on push/PR.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: # every DRA API shape across k8s 1.31-1.35 (all live-verified 2026-07-10)
          - "kindest/node:v1.31.6" # resource.k8s.io/v1alpha3 (alpha, basic wrapper)
          - "kindest/node:v1.32.2" # resource.k8s.io/v1beta1  (beta, basic wrapper)
          - "kindest/node:v1.33.1" # resource.k8s.io/v1beta2  (beta, flattened)
          - "" # kind default (GA -> resource.k8s.io/v1, flattened; also covers 1.35)
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install OR-Tools
        run: |
          curl -fsSL https://github.com/google/or-tools/releases/download/v${ORTOOLS_VERSION}/or-tools_amd64_debian-13_cpp_v${ORTOOLS_VERSION}.tar.gz \
            | sudo tar xz -C /usr/local --strip-components=1
          sudo ldconfig

      - name: Install kind
        run: |
          curl -fsSLo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: DRA version-adaptive smoke test
        run: scripts/dra-version-smoke.sh "${{ matrix.image }}"
