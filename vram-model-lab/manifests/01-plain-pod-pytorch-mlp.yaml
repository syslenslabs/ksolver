apiVersion: v1
kind: Pod
metadata:
  name: vram-demo-pod-pytorch-mlp
  annotations:
    ksolver.ai/vram-family: mlp
    ksolver.ai/vram-precision: fp16
    ksolver.ai/vram-batch-size: "64"
    ksolver.ai/vram-seq-len: "1024"
    ksolver.ai/vram-hidden-size: "2048"
    ksolver.ai/vram-layers: "6"
    ksolver.ai/vram-param-count: "11018240"
    ksolver.ai/vram-optimizer: adamw
spec:
  runtimeClassName: nvidia
  restartPolicy: Never
  containers:
    - name: trainer
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
      command: ["python", "-u", "-c"]
      args:
        - |
          import torch, torch.nn as nn
          device='cuda'
          model=nn.Sequential(nn.Linear(1024,2048),nn.GELU(),nn.Linear(2048,2048),nn.GELU(),nn.Linear(2048,1024)).to(device).half()
          opt=torch.optim.AdamW(model.parameters(),lr=1e-4)
          for _ in range(3):
            x=torch.randn(64,1024,device=device,dtype=torch.float16)
            y=model(x).float().pow(2).mean()
            opt.zero_grad(); y.backward(); opt.step(); torch.cuda.synchronize()
          print('done')
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
