apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: vram-demo-kubeflow-pytorchjob
  annotations:
    ksolver.ai/vram-family: transformer
    ksolver.ai/vram-precision: bf16
    ksolver.ai/vram-hidden-size: "1024"
    ksolver.ai/vram-layers: "8"
    ksolver.ai/vram-heads: "16"
    ksolver.ai/vram-param-count: "166337792"
    ksolver.ai/vram-optimizer: adamw
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      template:
        spec:
          runtimeClassName: nvidia
          containers:
            - name: pytorch
              image: ghcr.io/example/tiny-transformer-trainer:latest
              command: ["torchrun"]
              args: ["--nproc_per_node=1", "train.py", "--batch-size", "2", "--seq-len", "1024", "--precision", "bf16"]
    Worker:
      replicas: 1
      template:
        spec:
          runtimeClassName: nvidia
          containers:
            - name: pytorch
              image: ghcr.io/example/tiny-transformer-trainer:latest
              command: ["torchrun"]
              args: ["--nproc_per_node=1", "train.py", "--batch-size", "2", "--seq-len", "1024", "--precision", "bf16"]
